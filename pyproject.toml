[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-radar"
version = "0.1.0"
description = "Local job discovery and reviewed application assistant"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "httpx>=0.27",
  "playwright>=1.55",
  "pydantic>=2.9",
  "python-docx>=1.1",
  "python-multipart>=0.0.12",
  "pypdf>=5.0",
  "reportlab>=4.2",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
job-radar = "job_radar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["job_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

