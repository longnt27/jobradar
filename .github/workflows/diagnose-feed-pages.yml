name: Diagnose first-party feed page shapes

on:
  push:
    branches:
      - feat/job-feed-integration

permissions:
  contents: read
jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[diag-feeds]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install uv
          uv sync --locked --extra dev
      - name: Check first-party public page shapes
        env:
          DIAG_SITE: qualcomm
        run: uv run python scripts/diagnose_career_pages.py
