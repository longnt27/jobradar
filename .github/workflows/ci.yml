name: CI

on:
  push:
    branches:
      - main
      - feat/job-feed-integration
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Install Tectonic LaTeX renderer
        uses: wtfjoke/setup-tectonic@v4
        with:
          tectonic-version: "0.17.0"

      - name: Verify Python syntax before test collection
        run: uv run python -m compileall -q job_radar scripts tests

      - name: Run tests
        run: uv run pytest -q --ignore=tests/test_ui_regression_gate.py

  ui-regression:
    name: UI regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Install Tectonic LaTeX renderer
        uses: wtfjoke/setup-tectonic@v4
        with:
          tectonic-version: "0.17.0"

      - name: Run UI regression gate
        run: uv run pytest -q tests/test_ui_regression_gate.py

      - name: Upload UI regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-regression-${{ github.run_attempt }}
          path: artifacts/ui-regression/
          if-no-files-found: ignore
          retention-days: 14
