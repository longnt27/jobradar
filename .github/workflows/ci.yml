name: CI

on:
  push:
    branches:
      - main
      - feat/job-feed-integration
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Install portable document fonts
        if: github.ref != 'refs/heads/feat/job-feed-integration'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core fonts-liberation

      - name: Install Tectonic LaTeX renderer
        if: github.ref != 'refs/heads/feat/job-feed-integration'
        uses: wtfjoke/setup-tectonic@v4
        with:
          tectonic-version: "0.17.0"

      - name: Verify Python syntax before test collection
        run: uv run python -m compileall -q job_radar scripts tests

      - name: Run career feed backend tests on integration branch
        if: github.ref == 'refs/heads/feat/job-feed-integration'
        run: |
          uv run pytest -q \
            tests/test_career_feeds.py \
            tests/test_career_apis.py \
            tests/test_vinbus_feed.py \
            tests/test_vingroup_feed_audit.py \
            tests/test_domestic_bank_feeds.py \
            tests/test_foreign_bank_adapters.py \
            tests/test_feed_wave_3.py \
            tests/test_global_tech_c_feeds.py \
            tests/test_finance_insurance_feeds.py \
            tests/test_global_tech_feeds.py \
            tests/test_career_wave7.py \
            tests/test_feed_wave9.py \
            tests/test_career_feeds_agent2.py \
            tests/test_ci_live_career_feeds.py

      - name: Run tests
        if: github.ref != 'refs/heads/feat/job-feed-integration'
        run: uv run pytest -q --ignore=tests/test_ui_regression_gate.py

  ui-regression:
    name: UI regression gate
    # UI screenshots are not a career-collector gate; run on main and PRs to main.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Install portable document fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core fonts-liberation

      - name: Install Tectonic LaTeX renderer
        uses: wtfjoke/setup-tectonic@v4
        with:
          tectonic-version: "0.17.0"

      - name: Run UI regression gate
        run: uv run pytest -q tests/test_ui_regression_gate.py

      - name: Upload UI regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-regression-${{ github.run_attempt }}
          path: artifacts/ui-regression/
          if-no-files-found: ignore
          retention-days: 14
