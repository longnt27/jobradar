name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Check release version
        run: python scripts/check_release_version.py "$GITHUB_REF_NAME"
      - name: Verify release commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Install Playwright Chromium
        run: uv run playwright install chromium
      - name: Test release checks and installer
        run: uv run --extra dev pytest -q tests/test_updates.py tests/test_installer.py
      - name: Build release archives
        run: uv build
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
