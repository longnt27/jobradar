<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Radar — Settings wireframe</title>
<style>
:root{color-scheme:dark;--page:#0d1915;--nav:#0d272d;--modal:#172820;--surface:#1c3127;--line:#3b594a;--text:#eef7ef;--muted:#afc4b7;--mint:#8bdfb7}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select,input{font:inherit}button{cursor:pointer}
.appbar{height:80px;padding:0 30px;display:flex;align-items:center;gap:23px;background:var(--nav);position:relative;z-index:1}.brand-logo{width:52px;height:52px;display:block;flex:none}.appnav,.appnav-right{display:flex;align-items:center;gap:4px}.appnav-right{margin-left:auto;gap:24px}.app-tab{height:52px;min-width:76px;border:0;background:transparent;color:#c6d8d2;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 9px;font-size:11px;font-weight:700}.app-tab.active{background:#264952;color:#fff}.app-tab svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.avatar{width:45px;height:45px;display:grid;place-items:center;border-radius:50%;border:1px solid #547869;background:#24443e;color:#e8f7ed}.avatar svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8}
.underlay{max-width:1380px;margin:45px auto;padding:0 32px;filter:blur(1.5px);opacity:.45}.underlay h1{font-size:30px;margin:0 0 15px}.underlay .hero{height:120px;border:1px solid var(--line);background:#1c3d2f;border-radius:16px;margin-bottom:22px}.underlay .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.underlay .grid>div{height:115px;background:var(--modal);border:1px solid var(--line);border-radius:14px}.underlay .wide{height:225px;margin-top:18px;background:var(--modal);border:1px solid var(--line);border-radius:14px}
.overlay{position:fixed;inset:80px 0 0;background:rgba(0,0,0,.6);z-index:2;display:flex;align-items:center;justify-content:center;padding:24px}.modal{width:min(900px,calc(100vw - 48px));height:min(470px,calc(100vh - 136px));min-height:360px;display:flex;flex-direction:column;background:var(--modal);border:1px solid #4a6c57;border-radius:16px;box-shadow:0 25px 70px rgba(0,0,0,.6);overflow:hidden}.modal-header{height:70px;padding:0 30px;display:flex;align-items:center;justify-content:space-between;flex:none}.modal-header h1{font-size:24px;letter-spacing:-.04em;margin:0}.close{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--text);font-size:22px;line-height:1}
.primary{display:grid;grid-template-columns:repeat(3,1fr);padding:0 30px;border-bottom:1px solid var(--line);flex:none}.primary button{border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);height:46px;font-weight:700;text-align:left;padding:0 4px}.primary button[aria-selected="true"]{border-bottom-color:var(--mint);color:var(--mint)}.secondary{display:flex;gap:6px;padding:13px 30px;border-bottom:1px solid var(--line);background:#1b2e25;flex:none;overflow:auto;white-space:nowrap}.secondary button{border:1px solid transparent;background:none;color:var(--muted);padding:8px 11px;border-radius:7px;font-size:12px;font-weight:600}.secondary button[aria-selected="true"]{border-color:#597f65;background:#2a4735;color:var(--text)}
.content{padding:14px 30px 28px;overflow:auto;flex:1}.setting-row{min-height:72px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;border-bottom:1px solid var(--line);padding:15px 0}.setting-row:last-child{border-bottom:0}.setting-name{font-weight:700;color:var(--text)}.setting-help{font-size:12px;color:var(--muted);margin-top:3px}.value{color:var(--muted);font-size:13px}.control{min-width:225px;height:38px;color:var(--text);background:#102119;border:1px solid #5d806b;border-radius:8px;padding:0 12px}.action{min-height:38px;border:1px solid #6a9e80;background:transparent;color:var(--mint);font-weight:700;border-radius:8px;padding:0 13px;font-size:12px}.action.fill{background:var(--mint);color:#0c2318;border-color:var(--mint)}.right{display:flex;align-items:center;justify-content:flex-end;gap:12px}.segmented{display:flex;background:#0e2018;border:1px solid #5d806b;border-radius:8px;padding:3px}.segmented button{min-width:71px;height:32px;padding:0 12px;border:0;border-radius:5px;color:var(--muted);background:transparent;font-size:12px;font-weight:600}.segmented button.selected{background:#3b6c4e;color:white}.status{font-size:12px;color:var(--mint);font-weight:700}.status.muted{color:var(--muted)}.toggle{width:42px;height:24px;border:1px solid #648671;border-radius:20px;background:#304b39;padding:2px;display:flex;align-items:center}.toggle:before{content:"";width:18px;height:18px;border-radius:50%;background:#d9e6db}.toggle.on{background:#4f9d6c;justify-content:flex-end}.link{color:var(--mint);border:0;background:transparent;font-weight:700;padding:8px 0}
@media(max-width:700px){.appbar{padding:0 12px;gap:7px}.app-tab{min-width:50px}.app-tab:nth-child(n+4){display:none}.appnav-right{gap:7px}.overlay{padding:8px}.modal{width:100%;height:min(540px,calc(100vh - 96px))}.modal-header,.primary,.secondary,.content{padding-left:17px;padding-right:17px}.setting-row{grid-template-columns:1fr;gap:9px}.right{justify-content:flex-start}.control{min-width:180px}}
</style>
</head>
<body>
<header class="appbar">
<svg class="brand-logo" viewBox="0 0 64 64" fill="none" aria-label="Job Radar logo"><rect width="64" height="64" rx="16" fill="#B9E8CF"/><path d="M32 32V11a21 21 0 0 1 19.1 12.3L32 32Z" fill="#67B992"/><circle cx="32" cy="32" r="21" stroke="#163E34" stroke-width="3.5"/><circle cx="32" cy="32" r="11.5" stroke="#163E34" stroke-opacity=".46" stroke-width="3"/><path d="m32 32 14-12" stroke="#163E34" stroke-width="3.5" stroke-linecap="round"/><circle cx="32" cy="32" r="4" fill="#163E34"/><circle cx="46" cy="20" r="5" fill="#EF795B" stroke="#163E34" stroke-width="2"/></svg>
<nav class="appnav" aria-label="Main navigation">
<button class="app-tab active"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10h-6v-6H9v6H3z"/></svg>Home</button>
<button class="app-tab"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg>Jobs</button>
<button class="app-tab"><svg viewBox="0 0 24 24"><path d="M6 2h8l4 4v16H6zM14 2v5h4M9 12h6M9 16h6"/></svg>Applications</button>
<button class="app-tab"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m14.5 14.5 6 6M10 7v6M7 10h6"/></svg>Job sources</button>
<button class="app-tab"><svg viewBox="0 0 24 24"><path d="M3 21V7l6-3v17M9 8l6-3v16M15 9l6-3v15M2 21h20M5 10h1M11 12h1M17 12h1"/></svg>Employers</button>
</nav>
<div class="appnav-right"><button class="app-tab"><svg viewBox="0 0 24 24"><path d="M8 5h13M8 12h13M8 19h13M3 5h1M3 12h1M3 19h1"/></svg>Queue</button><div class="avatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="3.5"/><path d="M4.5 21v-2a7.5 7.5 0 0 1 15 0v2"/></svg></div></div>
</header>
<main class="underlay"><h1>Home</h1><div class="hero"></div><div class="grid"><div></div><div></div><div></div><div></div></div><div class="wide"></div></main>
<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-header"><h1 id="modal-title">Settings</h1><button class="close" type="button" aria-label="Close settings" title="Close settings">×</button></div><nav class="primary" id="primary" role="tablist" aria-label="Settings sections"></nav><nav class="secondary" id="secondary" role="tablist" aria-label="Settings subsections"></nav><div class="content" id="content" role="tabpanel"></div></section></div>
<script>
const groups={
  "General":{
    "Appearance":[
      {name:"Theme",help:"Follow macOS or choose a fixed appearance.",type:"segmented",options:["System","Light","Dark"]}
    ],
    "Updates":[
      {name:"Current version",value:"Installed desktop version"},
      {name:"Software update",help:"Check for a newer version of Job Radar.",type:"button",label:"Check for updates"}
    ],
    "Search preferences":[
      {name:"Target roles and locations",help:"Used for job discovery and matching.",type:"button",label:"Edit preferences"},
      {name:"Strong match threshold",help:"Scores at or above this value are strong matches.",type:"select",options:["75","80","85","90"]}
    ],
    "Draft automation":[
      {name:"Prepare drafts automatically",help:"For shortlisted jobs; you review before sending.",type:"toggle",enabled:false}
    ]
  },
  "AI Models":{
    "Resume extraction":[
      {name:"Provider",type:"select",options:["Choose provider","Local","Connected provider"]},
      {name:"Model",type:"select",options:["Choose model","Configured model"]},
      {name:"Import review",help:"Review extracted details before they update your profile.",value:"Required"}
    ],
    "Application writing":[
      {name:"Provider",type:"select",options:["Choose provider","Local","Connected provider"]},
      {name:"Model",type:"select",options:["Choose model","Configured model"]},
      {name:"Prompts and templates",help:"Instructions for application drafts.",type:"link",label:"Edit →"}
    ],
    "Job parsing":[
      {name:"Provider",type:"select",options:["Choose provider","Local","Connected provider"]},
      {name:"Model",type:"select",options:["Choose model","Configured model"]}
    ],
    "Job matching":[
      {name:"Provider",type:"select",options:["Choose provider","Local","Connected provider"]},
      {name:"Model",type:"select",options:["Choose model","Configured model"]},
      {name:"Background reviews",value:"32 waiting"}
    ]
  },
  "Connections":{
    "LinkedIn":[
      {name:"Status",type:"status",value:"Connected"},
      {name:"Account",value:"Connected account"},
      {name:"Connection",type:"button",label:"Manage"}
    ],
    "Facebook":[
      {name:"Status",type:"status",value:"Connected"},
      {name:"Account",value:"Connected account"},
      {name:"Connection",type:"button",label:"Manage"}
    ],
    "Telegram":[
      {name:"Status",type:"status",value:"Configured"},
      {name:"Notifications",type:"button",label:"Manage"}
    ],
    "Zalo":[
      {name:"Status",type:"status",value:"Not connected"},
      {name:"Connection",type:"button",label:"Configure"}
    ],
    "SMTP":[
      {name:"Status",type:"status",value:"Configured"},
      {name:"Email delivery",type:"button",label:"Manage"}
    ]
  }
};
let currentGroup="General",currentSub="Appearance";
function control(row){
  if(row.type==="select")return `<select class="control" aria-label="${row.name}">${row.options.map(x=>`<option>${x}</option>`).join("")}</select>`;
  if(row.type==="segmented")return `<div class="segmented" role="group" aria-label="${row.name}">${row.options.map((x,i)=>`<button type="button" class="${i===0?"selected":""}" aria-pressed="${i===0}">${x}</button>`).join("")}</div>`;
  if(row.type==="button")return `<button class="action" type="button">${row.label}</button>`;
  if(row.type==="link")return `<button class="link" type="button">${row.label}</button>`;
  if(row.type==="toggle")return `<button class="toggle ${row.enabled?"on":""}" type="button" role="switch" aria-checked="${row.enabled}" aria-label="${row.name}"></button>`;
  if(row.type==="status")return `<span class="status ${row.value==="Not connected"?"muted":""}">${row.value}</span>`;
  return `<span class="value">${row.value}</span>`;
}
function render(){
  document.getElementById("primary").innerHTML=Object.keys(groups).map(g=>`<button role="tab" type="button" aria-selected="${g===currentGroup}" data-group="${g}">${g}</button>`).join("");
  document.getElementById("secondary").innerHTML=Object.keys(groups[currentGroup]).map(s=>`<button role="tab" type="button" aria-selected="${s===currentSub}" data-sub="${s}">${s}</button>`).join("");
  document.getElementById("content").innerHTML=groups[currentGroup][currentSub].map(row=>`<div class="setting-row"><div><div class="setting-name">${row.name}</div>${row.help?`<div class="setting-help">${row.help}</div>`:""}</div><div class="right">${control(row)}</div></div>`).join("");
  document.querySelectorAll("[data-group]").forEach(b=>b.onclick=()=>{currentGroup=b.dataset.group;currentSub=Object.keys(groups[currentGroup])[0];render()});
  document.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{currentSub=b.dataset.sub;render()});
  document.querySelectorAll(".segmented button").forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll("button").forEach(other=>{other.classList.toggle("selected",other===b);other.setAttribute("aria-pressed",String(other===b))})});
  document.querySelectorAll(".toggle").forEach(b=>b.onclick=()=>{b.classList.toggle("on");b.setAttribute("aria-checked",String(b.classList.contains("on")))});
}
render();
</script>
</body>
</html>
